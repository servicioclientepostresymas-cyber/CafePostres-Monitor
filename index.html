<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CafePostres Monitor</title><style>html,body{margin:0;min-height:100%;font-family:Arial;background:#f7efdf;color:#28344a}.h{background:#263754;color:white;padding:18px;text-align:center}.box{max-width:560px;margin:25px auto;background:white;padding:24px;text-align:center;border-radius:12px;box-shadow:0 2px 9px #999}.qr{width:290px;height:290px;margin:20px auto}.qr img{width:100%;height:100%}.state{padding:11px;background:#fff6df;border-radius:7px}.err{background:#fde9e5}.ok{background:#e9f5e8}.btn{padding:12px 18px;background:#263754;color:white;border:0;border-radius:8px;font-size:17px}.timer{font-size:23px;font-weight:bold}</style></head><body><div class="h"><h1>CafePostres</h1><div>Monitor de pedidos · Acceso protegido</div></div><div class="box"><h2 id="title">🔒 Autorizar este monitor</h2><div id="info">Generando código de autorización…</div><div id="qr" class="qr"></div><div id="timer" class="timer"></div><div id="state" class="state">Preparando conexión segura…</div><button id="renew" class="btn" style="display:none" onclick="createChallenge()">Generar nuevo QR</button><p>Escanea el QR desde CafePostres y confirma <b>Autorizar</b>. Caduca en 2 minutos.</p></div><script>
var SUPABASE_PUBLISHABLE_KEY="sb_publishable_A-SSkw4xhgQE_K5E4mW3-A_GPIQZuHT";
var FUNCTION_URL="https://lpyeujvkqmbvigunbkni.supabase.co/functions/v1/cafepostres-monitor-auth";
var challengeId="",challengeSecret="",expiresAt=0,pollHandle=null,timerHandle=null;
function state(t,c){var e=document.getElementById('state');e.className='state '+(c||'');e.innerHTML=t}
function req(b,cb){var x=new XMLHttpRequest();x.open('POST',FUNCTION_URL,true);x.setRequestHeader('apikey',SUPABASE_PUBLISHABLE_KEY);x.setRequestHeader('Authorization','Bearer '+SUPABASE_PUBLISHABLE_KEY);x.setRequestHeader('Content-Type','application/json');x.timeout=12000;x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{cb(null,JSON.parse(x.responseText))}catch(e){cb('Respuesta inválida')}}else cb('Error HTTP '+x.status)};x.onerror=function(){cb('Error de conexión')};x.ontimeout=function(){cb('Tiempo agotado')};x.send(JSON.stringify(b))}
function stop(){if(pollHandle)clearInterval(pollHandle);if(timerHandle)clearInterval(timerHandle);pollHandle=timerHandle=null}
function createChallenge(){stop();challengeId=challengeSecret='';document.getElementById('renew').style.display='none';document.getElementById('qr').innerHTML='';if(SUPABASE_PUBLISHABLE_KEY==='PEGA_AQUI_TU_PUBLISHABLE_KEY'){state('Falta colocar la Publishable key en index.html.','err');return}req({action:'CREATE'},function(er,r){if(er||!r||!r.ok){state(er||'No se pudo crear el desafío.','err');return}challengeId=r.challengeId;challengeSecret=r.challengeSecret;expiresAt=new Date(r.expiresAt).getTime();var u='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(r.qrPayload);document.getElementById('qr').innerHTML='<img alt="QR" src="'+u+'">';document.getElementById('info').innerHTML='Escanea desde <b>CafePostres → Autorizar monitor</b>';state('Esperando autorización…','');tick();timerHandle=setInterval(tick,1000);pollHandle=setInterval(check,3000)})}
function tick(){var n=Math.max(0,Math.ceil((expiresAt-Date.now())/1000)),m=Math.floor(n/60),s=n%60;document.getElementById('timer').innerHTML='Caduca en '+m+':'+(s<10?'0':'')+s;if(n<=0){stop();challengeSecret='';state('Este QR ya no es válido.','err');document.getElementById('renew').style.display='inline-block'}}
function check(){if(!challengeId||!challengeSecret)return;req({action:'STATUS',challengeId:challengeId,challengeSecret:challengeSecret},function(er,r){if(er)return;if(r.status==='AUTHORIZED'){stop();document.getElementById('title').innerHTML='✓ Monitor autorizado';document.getElementById('timer').innerHTML='';state('Autorización recibida. Preparado para abrir pedidos.','ok')}else if(r.status==='EXPIRED'){stop();challengeSecret='';state('Este QR ya no es válido.','err');document.getElementById('renew').style.display='inline-block'}})}
createChallenge();</script></body></html>
