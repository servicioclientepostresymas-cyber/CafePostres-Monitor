<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>CafePostres - Monitor de Pedidos</title>
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:rgba(0,0,0,0); }
html,body { margin:0; padding:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; background:#f7efdf; color:#28344a; }
button { font-family:Arial,Helvetica,sans-serif; cursor:pointer; }
.header { background:#263754; color:#fff; padding:18px 22px; box-shadow:0 2px 7px rgba(0,0,0,.20); }
.header h1 { margin:0; font-size:30px; font-weight:bold; }
.header .sub { margin-top:5px; font-size:15px; opacity:.9; }
.toolbar { padding:14px 18px 5px; text-align:center; }
.tab { border:0; border-radius:8px; padding:13px 22px; margin:0 5px 8px; font-size:18px; background:#fff; color:#263754; box-shadow:0 1px 4px rgba(0,0,0,.16); }
.tab.active { background:#263754; color:#fff; }
.refresh { float:right; background:#f1a27f; color:#263754; border:0; border-radius:8px; padding:9px 14px; font-size:15px; font-weight:bold; }
.statusbar { margin:8px 18px 12px; padding:10px 13px; background:#fffaf2; border:1px solid #e4d8c5; border-radius:7px; font-size:14px; }
.dot { display:inline-block; width:10px; height:10px; border-radius:10px; background:#6eae78; margin-right:7px; }
.content { padding:0 18px 24px; }
.grid { font-size:0; margin:0 -7px; }
.card { display:inline-block; vertical-align:top; width:48%; margin:1%; background:#fff; border-radius:11px; box-shadow:0 2px 7px rgba(0,0,0,.14); overflow:hidden; font-size:16px; cursor:pointer; }
.cardtop { padding:15px 16px 9px; border-bottom:1px solid #eee5d9; }
.customer { font-size:23px; font-weight:bold; color:#263754; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta { margin-top:6px; font-size:14px; color:#707070; }
.cardbottom { padding:11px 16px 14px; }
.total { float:right; font-size:22px; font-weight:bold; color:#d77959; }
.badge { display:inline-block; padding:6px 9px; border-radius:13px; background:#e9ddf2; font-size:13px; font-weight:bold; color:#57456b; }
.clear { clear:both; }
.empty { text-align:center; padding:55px 20px; color:#766f67; font-size:20px; }
.panel { max-width:820px; margin:0 auto; background:#fff; border-radius:11px; box-shadow:0 2px 8px rgba(0,0,0,.15); overflow:hidden; }
.detailhead { padding:18px 20px; background:#fffaf2; border-bottom:1px solid #e7ddcf; }
.back { border:0; border-radius:7px; background:#263754; color:#fff; padding:10px 15px; font-size:16px; margin-right:12px; }
.detailname { font-size:26px; font-weight:bold; vertical-align:middle; }
.detailmeta { margin:12px 0 0; color:#6d6d6d; }
.item { padding:15px 20px; border-bottom:1px solid #eee; }
.itemname { font-size:20px; font-weight:bold; }
.qty { float:right; font-weight:bold; font-size:18px; }
.opts { margin-top:7px; color:#666; line-height:1.45; font-size:15px; }
.price { margin-top:6px; color:#d77959; font-weight:bold; }
.detailtotal { padding:18px 20px; text-align:right; font-size:26px; font-weight:bold; color:#263754; }
.setup { max-width:760px; margin:15px auto; background:#fff; padding:22px; border-radius:11px; box-shadow:0 2px 8px rgba(0,0,0,.14); }
.setup h2 { margin-top:0; }
.setup p { line-height:1.5; }
.field { margin:13px 0; }
.field label { display:block; font-weight:bold; margin-bottom:6px; }
.field input { width:100%; padding:12px; border:1px solid #bbb; border-radius:6px; font-size:16px; }
.save { border:0; background:#263754; color:#fff; padding:12px 18px; border-radius:7px; font-size:17px; }
.warn { background:#fff1d7; border:1px solid #edcf91; padding:11px; border-radius:6px; font-size:14px; line-height:1.4; }
@media (max-width:700px) {
 .card { width:98%; }
 .header h1 { font-size:25px; }
 .refresh { float:none; margin-top:9px; }
}
</style>
</head>
<body>
<div class="header">
  <button class="refresh" onclick="loadOrders()">Actualizar</button>
  <h1>CafePostres</h1>
  <div class="sub">Monitor de pedidos · C14 · Solo lectura</div>
  <div class="clear"></div>
</div>

<div class="toolbar">
  <button id="tabActive" class="tab active" onclick="setFilter('active')">Pedidos activos</button>
  <button id="tabDelivered" class="tab" onclick="setFilter('delivered')">Entregados</button>
  <button id="tabSetup" class="tab" onclick="showSetup()">Conexión</button>
</div>

<div id="status" class="statusbar"><span class="dot"></span>Modo demostración. Pulsa Conexión para enlazar el visor de solo lectura.</div>
<div id="content" class="content"></div>

<script>
/*
  CafePostres Monitor iPad C14
  Diseñado sin frameworks y con JavaScript ES5 para Safari de iOS 9.
  La conexión real debe apuntar a un endpoint/vista de SOLO LECTURA.
  No use aquí la contraseña de la cuenta genérica ni una service_role key.
*/
var currentFilter = 'active';
var allOrders = [];
var demoOrders = [
 {orderKey:'demo:101',customer:'María',createdAt:(new Date()).getTime()-240000,total:280,status:'Pendiente de pago / entrega',
  items:[{productName:'Crepa especial',quantity:2,unitPrice:95,variant:'',extras:'Fresa, Nutella',options:'Sin nuez',notes:''},{productName:'Cheesecake',quantity:1,unitPrice:90,variant:'',extras:'',options:'',notes:''}]},
 {orderKey:'demo:102',customer:'Carlos',createdAt:(new Date()).getTime()-720000,total:145,status:'Pendiente de pago / entrega',
  items:[{productName:'Crepa clásica',quantity:1,unitPrice:145,variant:'',extras:'Plátano',options:'Chocolate',notes:'Sin azúcar extra'}]},
 {orderKey:'demo:99',customer:'Ana',createdAt:(new Date()).getTime()-3600000,total:190,status:'Pagado / Entregado',
  items:[{productName:'Cheesecake',quantity:2,unitPrice:95,variant:'',extras:'',options:'',notes:''}]}
];

function esc(s) {
 s = String(s == null ? '' : s);
 return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n) { n = Number(n || 0); return '$' + n.toFixed(2); }
function when(ms) {
 var d = new Date(Number(ms || 0));
 if (isNaN(d.getTime())) return '';
 var h=d.getHours(), m=d.getMinutes();
 return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function isDelivered(status) {
 var s=String(status||'').toLowerCase();
 return s.indexOf('entregado')>=0 || s.indexOf('cancelado')>=0;
}
function setFilter(f) {
 currentFilter=f;
 document.getElementById('tabActive').className='tab'+(f==='active'?' active':'');
 document.getElementById('tabDelivered').className='tab'+(f==='delivered'?' active':'');
 document.getElementById('tabSetup').className='tab';
 renderOrders();
}
function renderOrders() {
 var list=[], i, o, html='';
 for(i=0;i<allOrders.length;i++) {
  o=allOrders[i];
  if((currentFilter==='delivered' && isDelivered(o.status)) || (currentFilter==='active' && !isDelivered(o.status))) list.push(o);
 }
 list.sort(function(a,b){return Number(b.createdAt||0)-Number(a.createdAt||0);});
 if(!list.length) { document.getElementById('content').innerHTML='<div class="empty">Sin pedidos en esta sección.</div>'; return; }
 html='<div class="grid">';
 for(i=0;i<list.length;i++) {
  o=list[i];
  html+='<div class="card" onclick="showDetail('+findIndex(o.orderKey)+')">'+
   '<div class="cardtop"><div class="customer">'+esc(o.customer||'Mostrador')+'</div>'+
   '<div class="meta">'+esc(when(o.createdAt))+' · '+esc(o.orderKey||'')+'</div></div>'+
   '<div class="cardbottom"><span class="badge">'+esc(o.status||'Pendiente')+'</span>'+
   '<span class="total">'+money(o.total)+'</span><div class="clear"></div></div></div>';
 }
 html+='</div>';
 document.getElementById('content').innerHTML=html;
}
function findIndex(key) {
 for(var i=0;i<allOrders.length;i++) if(allOrders[i].orderKey===key) return i;
 return 0;
}
function showDetail(idx) {
 var o=allOrders[idx], items=o.items||[], html='', i, x, opts;
 html='<div class="panel"><div class="detailhead"><button class="back" onclick="renderOrders()">◀ Pedidos</button>'+
 '<span class="detailname">'+esc(o.customer||'Mostrador')+'</span>'+
 '<div class="detailmeta">'+esc(o.status||'')+' · '+esc(when(o.createdAt))+'</div></div>';
 for(i=0;i<items.length;i++) {
  x=items[i]; opts=[];
  if(x.variant) opts.push(x.variant);
  if(x.extras) opts.push(x.extras);
  if(x.options) opts.push(x.options);
  if(x.notes) opts.push('Nota: '+x.notes);
  html+='<div class="item"><span class="qty">× '+esc(x.quantity||1)+'</span><div class="itemname">'+esc(x.productName||'Producto')+'</div>'+
  (opts.length?'<div class="opts">'+esc(opts.join(' · '))+'</div>':'')+
  '<div class="price">'+money(Number(x.unitPrice||0)*Number(x.quantity||1))+'</div></div>';
 }
 html+='<div class="detailtotal">Total: '+money(o.total)+'</div></div>';
 document.getElementById('content').innerHTML=html;
}
function showSetup() {
 document.getElementById('tabActive').className='tab';
 document.getElementById('tabDelivered').className='tab';
 document.getElementById('tabSetup').className='tab active';
 var endpoint=localStorage.getItem('cp_monitor_endpoint')||'';
 var token=localStorage.getItem('cp_monitor_token')||'';
 document.getElementById('content').innerHTML=
 '<div class="setup"><h2>Conexión de solo lectura</h2>'+
 '<div class="warn">Esta página está preparada para un endpoint dedicado de lectura. No introduzcas la contraseña de Google/Apple, la contraseña de Supabase ni una clave service_role.</div>'+
 '<div class="field"><label>URL del endpoint del monitor</label><input id="endpoint" value="'+esc(endpoint)+'" placeholder="https://..."></div>'+
 '<div class="field"><label>Token público/restringido del monitor (opcional)</label><input id="token" value="'+esc(token)+'" placeholder="Token de solo lectura"></div>'+
 '<button class="save" onclick="saveSetup()">Guardar y probar</button> '+
 '<button class="save" onclick="useDemo()">Ver demostración</button>'+
 '<p>Formato esperado: un arreglo JSON de pedidos con <b>orderKey, customer, createdAt, total, status</b> e <b>items</b>.</p></div>';
}
function saveSetup() {
 localStorage.setItem('cp_monitor_endpoint',document.getElementById('endpoint').value);
 localStorage.setItem('cp_monitor_token',document.getElementById('token').value);
 currentFilter='active';
 loadOrders();
}
function useDemo() {
 localStorage.removeItem('cp_monitor_endpoint');
 allOrders=demoOrders;
 document.getElementById('status').innerHTML='<span class="dot"></span>Demostración local · No modifica ningún pedido.';
 setFilter('active');
}
function requestJSON(url, token, ok, fail) {
 var x=new XMLHttpRequest();
 x.open('GET',url,true);
 x.onreadystatechange=function(){
  if(x.readyState===4) {
   if(x.status>=200 && x.status<300) {
    try { ok(JSON.parse(x.responseText)); } catch(e) { fail('Respuesta JSON inválida'); }
   } else fail('HTTP '+x.status);
  }
 };
 if(token) x.setRequestHeader('Authorization','Bearer '+token);
 x.timeout=12000;
 x.ontimeout=function(){fail('Tiempo de espera agotado');};
 try{x.send(null);}catch(e){fail(e.message||'Error de conexión');}
}
function loadOrders() {
 var endpoint=localStorage.getItem('cp_monitor_endpoint')||'';
 var token=localStorage.getItem('cp_monitor_token')||'';
 if(!endpoint) { allOrders=demoOrders; document.getElementById('status').innerHTML='<span class="dot"></span>Modo demostración · Configura el endpoint para ver pedidos reales.'; renderOrders(); return; }
 document.getElementById('status').innerHTML='<span class="dot"></span>Actualizando pedidos...';
 requestJSON(endpoint,token,function(data){
  if(data && data.orders) data=data.orders;
  if(Object.prototype.toString.call(data)!=='[object Array]') data=[];
  allOrders=data;
  document.getElementById('status').innerHTML='<span class="dot"></span>Conectado · '+allOrders.length+' pedido(s) · actualización automática cada 15 s.';
  renderOrders();
 },function(err){
  document.getElementById('status').innerHTML='<span class="dot" style="background:#c96b5c"></span>No se pudo actualizar: '+esc(err);
 });
}
loadOrders();
setInterval(function(){ if(localStorage.getItem('cp_monitor_endpoint')) loadOrders(); },15000);
</script>
</body>
</html>
