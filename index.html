<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CafePostres - Monitor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f7efdf;color:#28344a}
.header{background:#263754;color:#fff;padding:18px 22px;box-shadow:0 2px 7px rgba(0,0,0,.2)}
.header h1{margin:0;font-size:30px}.sub{margin-top:5px;font-size:15px;opacity:.9}
.refresh{float:right;background:#f1a27f;color:#263754;border:0;border-radius:8px;padding:10px 14px;font-weight:bold}
.clear{clear:both}.toolbar{text-align:center;padding:14px 18px 5px}
.tab{border:0;border-radius:8px;padding:13px 20px;margin:0 5px 8px;font-size:17px;background:#fff;color:#263754;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.tab.active{background:#263754;color:#fff}
.status{margin:8px 18px 12px;padding:10px 13px;background:#fffaf2;border:1px solid #e4d8c5;border-radius:7px;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:10px;background:#6eae78;margin-right:7px}
.content{padding:0 18px 24px}.grid{font-size:0;margin:0 -7px}
.card{display:inline-block;vertical-align:top;width:48%;margin:1%;background:#fff;border-radius:11px;box-shadow:0 2px 7px rgba(0,0,0,.14);overflow:hidden;font-size:16px;cursor:pointer}
.cardtop{padding:15px 16px 9px;border-bottom:1px solid #eee5d9}.customer{font-size:23px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:6px;font-size:14px;color:#707070}.cardbottom{padding:11px 16px 14px}
.total{float:right;font-size:22px;font-weight:bold;color:#d77959}.badge{display:inline-block;padding:6px 9px;border-radius:13px;background:#e9ddf2;font-size:13px;font-weight:bold;color:#57456b}
.empty{text-align:center;padding:55px 20px;color:#766f67;font-size:20px}
.panel{max-width:820px;margin:0 auto;background:#fff;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden}
.detailhead{padding:18px 20px;background:#fffaf2;border-bottom:1px solid #e7ddcf}.back{border:0;border-radius:7px;background:#263754;color:#fff;padding:10px 15px;font-size:16px;margin-right:12px}
.detailname{font-size:26px;font-weight:bold;vertical-align:middle}.detailmeta{margin:12px 0 0;color:#6d6d6d}
.item{padding:15px 20px;border-bottom:1px solid #eee}.itemname{font-size:20px;font-weight:bold}.qty{float:right;font-weight:bold;font-size:18px}
.opts{margin-top:7px;color:#666;line-height:1.45;font-size:15px}.price{margin-top:6px;color:#d77959;font-weight:bold}.detailtotal{padding:18px 20px;text-align:right;font-size:26px;font-weight:bold}
.setup{max-width:760px;margin:15px auto;background:#fff;padding:22px;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.field{margin:13px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #bbb;border-radius:6px;font-size:16px}
.save{border:0;background:#263754;color:#fff;padding:12px 18px;border-radius:7px;font-size:17px}.warn{background:#fff1d7;border:1px solid #edcf91;padding:11px;border-radius:6px;font-size:14px;line-height:1.4}
@media(max-width:700px){.card{width:98%}.header h1{font-size:25px}}
</style>
</head>
<body>
<div class="header"><button class="refresh" onclick="loadOrders()">Actualizar</button><h1>CafePostres</h1><div class="sub">Monitor de pedidos · Solo lectura</div><div class="clear"></div></div>
<div class="toolbar">
<button id="a" class="tab active" onclick="setFilter('active')">Pedidos activos</button>
<button id="d" class="tab" onclick="setFilter('delivered')">Entregados</button>
<button id="s" class="tab" onclick="showSetup()">Conexión</button>
</div>
<div id="status" class="status"><span class="dot"></span>Configura la conexión una sola vez.</div>
<div id="content" class="content"></div>
<script>
var filter='active',orders=[];
function e(v){v=String(v==null?'':v);return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(v){return '$'+Number(v||0).toFixed(2)}
function time(v){var d=new Date(Number(v||0));if(isNaN(d.getTime()))return '';var h=d.getHours(),m=d.getMinutes();return(h<10?'0':'')+h+':'+(m<10?'0':'')+m}
function done(s){s=String(s||'').toLowerCase();return s.indexOf('entregado')>=0||s.indexOf('cancelado')>=0}
function setFilter(f){filter=f;document.getElementById('a').className='tab'+(f==='active'?' active':'');document.getElementById('d').className='tab'+(f==='delivered'?' active':'');document.getElementById('s').className='tab';render()}
function render(){var l=[],i,o,h='<div class="grid">';for(i=0;i<orders.length;i++){o=orders[i];if((filter==='delivered'&&done(o.status))||(filter==='active'&&!done(o.status)))l.push(o)}
if(!l.length){document.getElementById('content').innerHTML='<div class="empty">Sin pedidos en esta sección.</div>';return}
for(i=0;i<l.length;i++){o=l[i];h+='<div class="card" onclick="detail(\''+e(o.order_key)+'\')"><div class="cardtop"><div class="customer">'+e(o.customer||'Mostrador')+'</div><div class="meta">'+e(time(o.created_at))+'</div></div><div class="cardbottom"><span class="badge">'+e(o.status||'Pendiente')+'</span><span class="total">'+money(o.total)+'</span><div class="clear"></div></div></div>'}h+='</div>';document.getElementById('content').innerHTML=h}
function detail(k){var o=null,i,x,it=[],h,op=[];for(i=0;i<orders.length;i++)if(orders[i].order_key===k){o=orders[i];break}if(!o)return;it=o.items||[];h='<div class="panel"><div class="detailhead"><button class="back" onclick="render()">◀ Pedidos</button><span class="detailname">'+e(o.customer||'Mostrador')+'</span><div class="detailmeta">'+e(o.status||'')+' · '+e(time(o.created_at))+'</div></div>';
for(i=0;i<it.length;i++){x=it[i];op=[];if(x.variant)op.push(x.variant);if(x.extras)op.push(x.extras);if(x.options)op.push(x.options);if(x.notes)op.push('Nota: '+x.notes);h+='<div class="item"><span class="qty">× '+e(x.quantity||1)+'</span><div class="itemname">'+e(x.productName||'Producto')+'</div>'+(op.length?'<div class="opts">'+e(op.join(' · '))+'</div>':'')+'<div class="price">'+money(Number(x.unitPrice||0)*Number(x.quantity||1))+'</div></div>'}h+='<div class="detailtotal">Total: '+money(o.total)+'</div></div>';document.getElementById('content').innerHTML=h}
function showSetup(){document.getElementById('a').className='tab';document.getElementById('d').className='tab';document.getElementById('s').className='tab active';var u=localStorage.getItem('cp_url')||'',k=localStorage.getItem('cp_key')||'';document.getElementById('content').innerHTML='<div class="setup"><h2>Conexión Supabase</h2><div class="warn">Usa solamente Project URL y Publishable key (sb_publishable_...). Nunca uses Secret key ni service_role.</div><div class="field"><label>Project URL</label><input id="url" value="'+e(u)+'" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Publishable key</label><input id="key" value="'+e(k)+'" placeholder="sb_publishable_..."></div><button class="save" onclick="save()">Guardar y conectar</button></div>'}
function save(){var u=document.getElementById('url').value,k=document.getElementById('key').value;if(u.charAt(u.length-1)==='/')u=u.substring(0,u.length-1);localStorage.setItem('cp_url',u);localStorage.setItem('cp_key',k);filter='active';loadOrders()}
function loadOrders(){var u=localStorage.getItem('cp_url')||'',k=localStorage.getItem('cp_key')||'';if(!u||!k){showSetup();return}document.getElementById('status').innerHTML='<span class="dot"></span>Actualizando...';var x=new XMLHttpRequest();x.open('POST',u+'/rest/v1/rpc/cafepostres_monitor_feed',true);x.setRequestHeader('apikey',k);x.setRequestHeader('Content-Type','application/json');x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{orders=JSON.parse(x.responseText)||[];document.getElementById('status').innerHTML='<span class="dot"></span>Conectado · '+orders.length+' pedido(s) · actualización cada 15 s';setFilter(filter)}catch(z){err('JSON inválido')}}else err('HTTP '+x.status)}};x.timeout=12000;x.ontimeout=function(){err('Tiempo de espera agotado')};try{x.send('{}')}catch(z){err('Error de conexión')}}
function err(t){document.getElementById('status').innerHTML='<span class="dot" style="background:#c96b5c"></span>No se pudo actualizar: '+e(t)}
loadOrders();setInterval(function(){if(localStorage.getItem('cp_url'))loadOrders()},15000);
</script>
</body></html>
